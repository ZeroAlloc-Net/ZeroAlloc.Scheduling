coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    # Informational, so it never blocks a merge. The baseline gate only governs the project status.
    patch:
      default:
        target: 80%
        informational: true
ignore:
  - "tests/**"
  - "benchmarks/**"
  - "samples/**"
  - "**/obj/**"
  - "**/*.g.cs"
