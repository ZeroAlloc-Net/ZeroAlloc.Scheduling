name: CI

on:
  push:
    branches: [main, 'release-please--**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov upload via OIDC, no token secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Run GitVersion
        id: gitversion
        run: |
          VERSION=$(dotnet gitversion /showvariable SemVer)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.gitversion.outputs.version }}

      # --collect "XPlat Code Coverage" makes vstest load coverlet's in-proc collector,
      # which writes every module's hits when the test session ends. With the runsettings
      # file alone, hits are written only by ProcessExit handlers, and vstest kills a test
      # host that has not exited 100 ms after the run, so a module can read 0 at random.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal --collect "XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults

      # Merges the Cobertura reports and fails below the line coverage floor, or when codecov.yml would let a drop in
      # coverage pass quietly. Shared from ci-baseline, pinned to the moving v1 tag.
      - name: Coverage gate
        uses: MarcelRoozekrans/ci-baseline/actions/coverage-gate@v1
        with:
          reports: TestResults/**/coverage.cobertura.xml

      - name: Upload coverage to Codecov
        if: '!cancelled()'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: "TestResults/**/coverage.cobertura.xml"
          disable_search: true   # only the files above, not every *.xml the search finds
          fail_ci_if_error: false

      - name: Pack (verify)
        env:
          VERSION: ${{ steps.gitversion.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          # The same discovery the release workflow uses, so CI pack-tests exactly the set
          # a release ships. The hardcoded list here covered 8 of the 11 packages and missed
          # Orm, Resilience and Telemetry, so a pack failure in any of those surfaced only at
          # release time. See ZeroAlloc-Net/.github#36.
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (IsPackable=false)"
              continue
            fi
            echo "Packing $csproj at $VERSION"
            dotnet pack "$csproj" --no-build -c Release -p:Version="$VERSION" -o ./artifacts
          done
          ls -la ./artifacts
          if ! ls ./artifacts/*.nupkg >/dev/null 2>&1; then
            echo "::error::no packages were produced"
            exit 1
          fi

  aot-smoke:
    runs-on: ubuntu-latest
    # Publishes samples/ZeroAlloc.Scheduling.AotSmoke with PublishAot=true.
    # Runs a job end to end through AddSerializerDispatcher() + AddScheduling(), the
    # IScheduler, the worker and the generator-emitted executor, with every trim and
    # AOT warning an error. The payload serializer is where reflection could leak.
    # One scenario per package: core + InMemory, Mediator, Resilience, Telemetry, Orm on an
    # in-memory SQLite database, and Redis against the service container below.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Install AOT native toolchain
        # NativeAOT links with clang and the zlib headers. The runner image ships clang, so apt
        # runs only for what is missing. apt has no network timeout of its own: a stalled mirror
        # used to hang this step until the job timed out. See ZeroAlloc-Net/.github#47.
        timeout-minutes: 5
        run: |
          missing=""
          command -v clang >/dev/null || missing="$missing clang"
          dpkg -s zlib1g-dev >/dev/null 2>&1 || missing="$missing zlib1g-dev"
          if [ -z "$missing" ]; then
            echo "clang and zlib1g-dev are already installed"
            exit 0
          fi
          echo "Installing:$missing"
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y $missing

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Scheduling.AotSmoke/ZeroAlloc.Scheduling.AotSmoke.csproj

      - name: Publish AOT
        run: dotnet publish samples/ZeroAlloc.Scheduling.AotSmoke/ZeroAlloc.Scheduling.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out

      - name: Run AOT binary
        env:
          ZA_SMOKE_REDIS: localhost:6379
        run: ./aot-out/ZeroAlloc.Scheduling.AotSmoke

  # The generator runs in the consumer's compiler. A generator built against a newer Roslyn
  # than that compiler is skipped with CS9057, and the generated AddPingJob method goes missing.
  # The adapters bring their dependencies' generators as well.
  # This builds a net10.0 consumer of every packed package with the oldest supported SDK band,
  # 10.0.1xx, whose compiler is Roslyn 5.0. See ZeroAlloc-Net/.github#77.
  sdk10-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # global.json's SDK packs the repository; the smoke folder's own global.json pins
          # 10.0.100 with rollForward latestPatch, so a newer band cannot stand in for 10.0.1xx.
          global-json-file: global.json
          dotnet-version: 10.0.1xx

      - name: Pack
        run: |
          version="9.9.9-local.sha${GITHUB_SHA::7}"
          echo "SCHEDULING_VERSION=$version" >> "$GITHUB_ENV"
          # Every package under src. ZeroAlloc.Scheduling bundles the generator, so the standalone
          # generator package is left out.
          for project in src/ZeroAlloc.Scheduling*/ZeroAlloc.Scheduling*.csproj; do
            case "$project" in *.Generator.csproj) continue ;; esac
            dotnet pack "$project" -c Release -o artifacts -p:Version="$version"
          done
          # A package the consumer leaves out is a dependency graph nobody checks, so a new
          # adapter fails here until the consumer references it.
          # MSBuild evaluates the project, so a reference inside an XML comment does not count.
          # NuGet package IDs are case-insensitive, so the match is too.
          consumer=tests/ZeroAlloc.Scheduling.Sdk10Smoke/Consumer
          referenced=$(cd "$consumer" && dotnet msbuild -getItem:PackageReference -p:ZeroAllocSchedulingVersion="$version" \
            | python3 -c 'import json, sys; print("\n".join(i["Identity"] for i in json.load(sys.stdin)["Items"]["PackageReference"]))')
          for package in artifacts/*."$version".nupkg; do
            id=$(basename "$package" ".$version.nupkg")
            if ! grep -qixF "$id" <<< "$referenced"; then
              echo "::error::$consumer does not reference $id"
              exit 1
            fi
          done

      - name: Build and run the consumer
        working-directory: tests/ZeroAlloc.Scheduling.Sdk10Smoke/Consumer
        run: |
          dotnet --version
          dotnet run -c Release -p:ZeroAllocSchedulingVersion="$SCHEDULING_VERSION"

  # Fails when a packed DLL references Roslyn above 5.0.0, the compiler of SDK 10.0.1xx.
  roslyn-floor:
    uses: ZeroAlloc-Net/.github/.github/workflows/roslyn-floor.yml@main

  api-compat:
    uses: ZeroAlloc-Net/.github/.github/workflows/api-compat.yml@main
    with:
      dotnet-version: |
        10.0.x
        11.0.x

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
